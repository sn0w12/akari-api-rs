[package]
name = "html-to-img"
version = "0.1.0"
edition = "2024"
description = "Chromium-free HTML to PNG rendering built on Blitz"

[dependencies]
anyrender = "0.6"
anyrender_vello_cpu = "0.7"
base64 = "0.22"
blitz-dom = "0.2"
blitz-html = "0.2"
blitz-net = "0.2"
blitz-paint = "0.2"
blitz-traits = "0.2"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
png = "0.17"
resvg = "0.45"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
criterion = { version = "0.6", features = ["async_futures", "async_tokio"] }

[[bench]]
name = "render"
harness = false
